# gz topic published by the Simulator core
- ros_topic_name: "clock"
  gz_topic_name: "clock"
  ros_type_name: "rosgraph_msgs/msg/Clock"
  gz_type_name: "gz.msgs.Clock"
  direction: GZ_TO_ROS

# joint_states NOT bridged from Gazebo: the JointStatePublisher plugin sends
# timestamps at physics rate (non-monotonic), causing robot_state_publisher to
# detect "Moved backwards in time" and re-publish wheel TF with old timestamps.
# This flushes all nodes' TF buffers, breaking the laser_frame->odom lookup.
# Instead, joint_state_publisher (ROS2 package) publishes zero-position joints
# at 10 Hz using sim clock (monotonic) → robot_state_publisher is happy.

# gz topic published by DiffDrive plugin
- ros_topic_name: "odom"
  gz_topic_name: "odom"
  ros_type_name: "nav_msgs/msg/Odometry"
  gz_type_name: "gz.msgs.Odometry"
  direction: GZ_TO_ROS

# TF NOT bridged from Gazebo: the DiffDrive plugin publishes Pose_V at physics
# rate with non-monotonic timestamps, causing endless "jump back in time" errors
# that prevent SLAM from processing scans. Instead, odom_to_tf.py subscribes to
# /odom (30 Hz, monotonic) and publishes the odom->base_footprint TF cleanly.

# gz topic subscribed to by DiffDrive plugin
- ros_topic_name: "cmd_vel"
  gz_topic_name: "cmd_vel"
  ros_type_name: "geometry_msgs/msg/Twist"
  gz_type_name: "gz.msgs.Twist"
  direction: ROS_TO_GZ

